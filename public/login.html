<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/img/favicon.png">

    <style>
        /* ============================
            🇮🇳 GOVERNMENT LOGIN THEME
        ============================ */

        /* Tricolor Strip Top */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #FF9933, white, #138808);
            z-index: 9999;
        }

        /* Background */
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: url("assets/img/bg.jpg") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        /* Login Box */
        .login-box {
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.20);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: white;
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
            z-index: 2;
            border-top: 5px solid #0C4A85;
        }

        /* Government Emblem */
        .login-box::before {
            content: "";
            background: url("assets/img/india-emblem.png") no-repeat center;
            background-size: 85px;
            position: absolute;
            top: -95px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Heading */
        .login-box h2 {
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 700;
            color: #08345c !important;
            text-shadow: none !important;
        }

        .login-box p {
            margin-bottom: 20px;
            opacity: 1;
            color: #111;
            font-weight: 500;
        }

        /* Inputs */
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid #ddd;
            background: white;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            color: #222;
        }

        /* Button */
        .login-box button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: #0C4A85;
            color: white;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .login-box button:hover {
            background: #062f57;
            transform: scale(1.03);
        }

        /* Error */
        .error {
            margin-top: 10px;
            color: #ff4444 !important;
            font-size: 14px;
            display: none;
            font-weight: 600;
        }

        /* Admin Badge */
        .admin-badge {
            background: #0C4A85;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 10px;
            color: #fff;
            font-weight: 600;
            border-left: 4px solid #052f5f;
        }

        /* Success Popup */
        .popup {
            position: fixed;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ca24c;
            padding: 12px 25px;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            opacity: 0;
            transition: all .4s ease;
            z-index: 9999;
            font-weight: 600;
        }

        .popup.show {
            top: 20px;
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="bg-overlay"></div>

    <!-- SUCCESS POPUP -->
    <div id="loginSuccessPopup" class="popup">
        ✔️ Login Successful
    </div>

    <div class="login-box">
        <div class="admin-badge">🇮🇳 अधिकृत प्रशासक प्रवेश</div>

        <h2>प्रशासनिक लॉगिन</h2>
        <p>⚠️ हे पोर्टल अधिकृत सरकारी वापरकर्त्यांसाठी मर्यादित आहे</p>

        <input type="password" id="adminPass" placeholder="अधिकृत पासवर्ड टाका">
        <button onclick="loginAdmin()">लॉगिन करा</button>

        <p id="errorMsg" class="error">❌ चुकीचा पासवर्ड!</p>
    </div>

    <script>
        const CORRECT_PASSWORD = "admin123";

        function showLoginSuccessPopup() {
            const p = document.getElementById("loginSuccessPopup");
            p.classList.add("show");
            setTimeout(() => p.classList.remove("show"), 2000);
        }

        function loginAdmin() {
            const pass = document.getElementById("adminPass").value;
            const errorBox = document.getElementById("errorMsg");

            if (pass === CORRECT_PASSWORD) {
                showLoginSuccessPopup();
                localStorage.setItem("isAdminLoggedIn", "true");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);

            } else {
                errorBox.style.display = "block";
                errorBox.textContent = "❌ चुकीचा पासवर्ड!";
            }
        }
    </script>

</body>

</html>
